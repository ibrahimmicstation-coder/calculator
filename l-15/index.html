<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM - Event Listeners</title>
</head>

<body>
    <nav class="block">
        <p>welcome to my website</p>
    </nav>
    <div class="block">
        <h4 id="name-block">hey there, my name is <span id="username">Ibrahim Ahmad</span></h4>
        <p class="paragraph">here is code for you</p>
        <pre><code>console.log("hey there")</code></pre>
    </div>

    <div class="block">
        <h4>this div can't be hacked! loser hahahah</h4>
    </div>

    <button onclick="handleButtonClick()">Click Me</button>
    <button id="clickbtn">Click Me Bro</button>
    <button id="btndaddy">Click Me, daddy</button>
    <button id="changebtn">change button</button>


    <script>
        function handleButtonClick(params) {
            console.log("that button is clicked");
            alert("hey i am clicked");
        }

        const clickbtn = document.getElementById("clickbtn");
        clickbtn.onclick = function () {
            console.log("i am clicked broo");
        }

        // most preffered way to add event listeners
        function doSomething() {
            console.log("hey me daddy button clicked by you");
        }

        const btndaddy = document.getElementById("btndaddy");
        btndaddy.addEventListener("click", doSomething())

        // change html using button
        const nameBlock = document.getElementById("name-block");
        const changebtn = document.getElementById("changebtn");
        changebtn.addEventListener("click", () => {
            if (nameBlock.style.color === "red") {
                nameBlock.style.color = "blue";
            } else {
                nameBlock.style.color = "red";
            }
        })

        let allChildren = document.querySelector("body").children;
        for (let i = 0; i < allChildren.length; i++) {
            allChildren[i].addEventListener("click", ()=>{
                allChildren[i].remove();
            })
        }
    </script>
</body>

</html>
