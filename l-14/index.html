<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM - getElementsByClassName</title>
</head>
<body>
    <nav class="block">
        <p>welcome to my website</p>
    </nav>
    <div class="block">
        <h4>hey there, my name is <span id="username">Ibrahim Ahmad</span></h4>
        <p class="paragraph">here is code for you</p>
        <pre><code>console.log("hey there")</code></pre>
    </div>

    <div class="block">
        <h4>this div can't be hacked! loser hahahah</h4>
    </div>

    <script>
        const elements = document.getElementsByClassName("block");
        for (let i = 0; i < elements.length; i++) {
            elements[i].style.background = "purple";
            elements[i].style.color = "white";
        }
    </script>
</body>
</html>
